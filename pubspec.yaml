name: flexpro_coaching
description: FlexPro Coaching by Tasos Misailidis — Premium fitness coaching app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Local storage
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0

  # Subscriptions
  purchases_flutter: ^8.0.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.2
  url_launcher: ^6.3.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#0A0A0F"
  color_dark: "#0A0A0F"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0A0A0F"
    color_dark: "#0A0A0F"
    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
